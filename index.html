<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>bigorna</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="barra">
    <button id="btn-lateral" title="Mostrar / esconder pastas">
      <svg viewBox="0 0 16 16" width="14" height="14"><path fill="currentColor" d="M1 2h14v12H1V2zm1 1v10h3V3H2zm4 0v10h8V3H6z"/></svg>
    </button>
    <span id="nome-arquivo">bigorna</span>
  </header>

  <!-- a sombra que mostra onde a aba arrastada vai cair -->
  <div id="sombra-de-soltar" hidden></div>

  <div id="corpo">
    <aside id="lateral">
      <div id="raiz-nome"></div>
      <div id="arvore"></div>
    </aside>
    <div id="divisor-lateral" title="Arraste pra mudar a largura da lateral"></div>

    <main id="direita">
      <section id="editor-area">
        <div id="editor"></div>
        <div id="visor" hidden></div>
        <div id="visor-doc" hidden></div>
        <div id="divisor-meio" title="Arraste pra mudar a divisão"></div>
        <div id="vazio">
          <img id="marca" src="bigorna.png" alt="" draggable="false">
        </div>
      </section>
      <div id="divisor" title="Arraste pra mudar a altura do terminal"></div>
      <section id="terminal-area">
        <div id="colunas"></div>
        <div id="shell-fim" hidden>
          <p>nenhum terminal aberto</p>
          <button id="btn-reabrir">abrir um novo</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ordem importa: xterm antes do loader do Monaco (o loader confunde scripts UMD) -->
  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-webgl/lib/addon-webgl.js"></script>
  <script src="node_modules/nostalgist/dist/nostalgist.umd.js"></script>
  <script src="node_modules/monaco-editor/min/vs/loader.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
